<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ROXダメージ計算機</title>

<style>
.tab-container {
    display: flex;
    gap: 8px;
    margin: 10px auto;
    justify-content: center;
}
.tab-button {
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    color: #fff;
    border: none;
}
.tab-button.attack { background: #d9534f; }
.tab-button.attack.active { background: #c9302c; }
.tab-button.defense { background: #5bc0de; }
.tab-button.defense.active { background: #31b0d5; }

.set-name-box {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 6px;
    margin: 10px auto;
}
.set-name-box input {
    padding: 4px 8px;
    width: 200px;
}
</style>
</head>

<body>

<!-- 攻撃側タブ -->
<div id="attackTabs" class="tab-container">
    <button class="tab-button attack" data-set="atk1" draggable="true">攻撃1</button>
    <button class="tab-button attack" data-set="atk2" draggable="true">攻撃2</button>
    <button class="tab-button attack" data-set="atk3" draggable="true">攻撃3</button>
    <button class="tab-button attack" data-set="atk4" draggable="true">攻撃4</button>
    <button class="tab-button attack" data-set="atk5" draggable="true">攻撃5</button>
</div>

<div class="set-name-box">
    <label>攻撃セット名：</label>
    <input id="attackSetName" type="text">
    <button id="saveAttackName">保存</button>
</div>

<!-- 防御側タブ -->
<div id="defenseTabs" class="tab-container">
    <button class="tab-button defense" data-set="def1" draggable="true">防御1</button>
    <button class="tab-button defense" data-set="def2" draggable="true">防御2</button>
    <button class="tab-button defense" data-set="def3" draggable="true">防御3</button>
    <button class="tab-button defense" data-set="def4" draggable="true">防御4</button>
    <button class="tab-button defense" data-set="def5" draggable="true">防御5</button>
</div>

<div class="set-name-box">
    <label>防御セット名：</label>
    <input id="defenseSetName" type="text">
    <button id="saveDefenseName">保存</button>
</div>

<button id="shortUrlButton" style="margin:10px auto; display:block;">短縮URLコピー</button>

<form id="calcForm">

<h3>攻撃側</h3>

<label>最終物理貫通：</label>

<input type="number" id="criDamage" value="0"><br>

<label>物理増強：</label>
<input type="number" id="physicalEnhance" value="0"><br>

<label>最終増強：</label>
<input type="number" id="finalEnhance" value="0"><br>

<label>種族ダメージ増加：</label>
<input type="number" id="raceDamageIncrease" value="0"><br>

<label>属性ダメージ増加：</label>
<input type="number" id="attributeDamageIncrease" value="0"><br>

<label>サイズダメージ増加：</label>
<input type="number" id="sizeDamageIncrease" value="0"><br>

<label>最終ダメージ増加：</label>
<input type="number" id="finalDamageIncrease" value="0"><br>

<label>ダメージアップ：</label>
<input type="number" id="damageUp" value="0"><br>

<label>属性強化：</label>
<input type="number" id="attributeEnhance" value="0"><br>

<input type="number" id="skillMultiplier" value="0"><br>

<label>最終物理ダメージ軽減：</label>
<input type="number" id="finalPhysicalDamageReduce" value="0"><br>

<input type="number" id="raceDamageReduce" value="0"><br>

<input type="number" id="attributeDamageReduce" value="0"><br>

<label>サイズ被ダメージ軽減：</label>
<input type="number" id="sizeDamageReduce" value="0"><br>

<input type="number" id="pvpPhysicalDamageReduce" value="0"><br>

<input type="number" id="pvpFinalPhysicalDamageReduce" value="0"><br>

<button type="button" onclick="calculateDamage()">計算</button>

</form>

<div style="margin-top:20px;">
    <h3>結果</h3>
    通常攻撃：<span id="resultNormal">0</span><br>
    クリティカル：<span id="resultCri">0</span><br>
    PVPダメージ：<span id="resultPvp">0</span><br>
    PVPクリティカル：<span id="resultPvpCri">0</span><br>
    吸収：<span id="resultAbsorb">0</span><br>

</div>
<script>

/* ============================================
   PART 2: セット保存・読み込み（元フォーム対応）
============================================ */

function saveSet(key) {
    const fields = document.querySelectorAll("#calcForm input");
    const data = {};

    fields.forEach(f => {
        data[f.id] = f.value;
    });

    sessionStorage.setItem(key, JSON.stringify(data));
}

function loadSet(key) {
    const raw = sessionStorage.getItem(key);
    if (!raw) return;

    const data = JSON.parse(raw);

    Object.keys(data).forEach(id => {
        const el = document.getElementById(id);
        if (el) el.value = data[id];
    });
}

</script>
<script>

/* ============================================
   PART 3: セット名保存・反映
============================================ */

/* セット名を保存する */
function saveSetName(type, key, name) {
    const storageKey = type === "attack" ? "attackNames" : "defenseNames";
    const names = JSON.parse(sessionStorage.getItem(storageKey) || "{}");

    names[key] = name;
    sessionStorage.setItem(storageKey, JSON.stringify(names));
}

/* セット名をタブに反映する */
function loadSetNames() {
    const atk = JSON.parse(sessionStorage.getItem("attackNames") || "{}");
    const def = JSON.parse(sessionStorage.getItem("defenseNames") || "{}");

    /* 攻撃タブ反映 */
    document.querySelectorAll("#attackTabs .tab-button").forEach(btn => {
        const key = btn.dataset.set;
        btn.textContent = atk[key] || ("攻撃" + key.replace("atk", ""));
    });

    /* 防御タブ反映 */
    document.querySelectorAll("#defenseTabs .tab-button").forEach(btn => {
        const key = btn.dataset.set;
        btn.textContent = def[key] || ("防御" + key.replace("def", ""));
    });
}

/* セット名入力欄に反映する */
function updateNameInput(type, key) {
    const storageKey = type === "attack" ? "attackNames" : "defenseNames";
    const names = JSON.parse(sessionStorage.getItem(storageKey) || "{}");

    const input = document.getElementById(type + "SetName");
    input.value = names[key] || "";
}

</script>
<script>

/* ============================================
   PART 4: ドラッグ並び替え（攻撃／防御タブ）
============================================ */

function enableTabDrag(containerId, storageKey) {
    const container = document.getElementById(containerId);
    let dragTarget = null;

    /* ドラッグ開始 */
    container.addEventListener("dragstart", e => {
        if (e.target.classList.contains("tab-button")) {
            dragTarget = e.target;
            e.dataTransfer.effectAllowed = "move";
        }
    });

    /* ドラッグ中（位置判定） */
    container.addEventListener("dragover", e => {
        e.preventDefault();
        const target = e.target.closest(".tab-button");
        if (!target || target === dragTarget) return;

        const rect = target.getBoundingClientRect();
        const after = (e.clientX - rect.left) > rect.width / 2;

        container.insertBefore(dragTarget, after ? target.nextSibling : target);
    });

    /* ドロップ後（順番保存） */
    container.addEventListener("drop", () => {
        const order = [...container.querySelectorAll(".tab-button")]
            .map(btn => btn.dataset.set);

        sessionStorage.setItem(storageKey, JSON.stringify(order));
    });
}

/* 保存された順番を復元 */
function restoreTabOrder(containerId, storageKey) {
    const container = document.getElementById(containerId);
    const raw = sessionStorage.getItem(storageKey);
    if (!raw) return;

    const order = JSON.parse(raw);
    const buttons = [...container.querySelectorAll(".tab-button")];

    order.forEach(key => {
        const btn = buttons.find(b => b.dataset.set === key);
        if (btn) container.appendChild(btn);
    });
}

</script>
<script>

/* ============================================
   PART 5: 短縮URL生成・復元
============================================ */

/* 短縮URL生成 */
function generateShortURL() {

    /* 保存対象セット一覧 */
    const keys = [
        "atk1","atk2","atk3","atk4","atk5",
        "def1","def2","def3","def4","def5"
    ];

    const data = {};

    /* 各セットのステータスをまとめる */
    keys.forEach(key => {
        data[key] = JSON.parse(sessionStorage.getItem(key) || "{}");
    });

    /* セット名 */
    data.attackNames = JSON.parse(sessionStorage.getItem("attackNames") || "{}");
    data.defenseNames = JSON.parse(sessionStorage.getItem("defenseNames") || "{}");

    /* タブ並び順 */
    data.attackOrder = JSON.parse(sessionStorage.getItem("attackOrder") || "[]");
    data.defenseOrder = JSON.parse(sessionStorage.getItem("defenseOrder") || "[]");

    /* 圧縮 */
    const encoded = btoa(JSON.stringify(data));

    /* URL生成 */
    return `${location.origin}${location.pathname}?s=${encoded}`;
}

/* ボタン押下 → URLコピー */
document.getElementById("shortUrlButton").addEventListener("click", () => {
    const url = generateShortURL();
    navigator.clipboard.writeText(url);
    alert("短縮URLをコピーしました！");
});

/* 短縮URLの展開（復元） */
function loadShortURLData() {
    const params = new URLSearchParams(location.search);
    const encoded = params.get("s");
    if (!encoded) return;

    try {
        const data = JSON.parse(atob(encoded));

        /* 全データを sessionStorage に戻す */
        for (const key in data) {
            sessionStorage.setItem(key, JSON.stringify(data[key]));
        }

        /* セット名反映 */
        loadSetNames();

        /* タブ並び順復元 */
        restoreTabOrder("attackTabs", "attackOrder");
        restoreTabOrder("defenseTabs", "defenseOrder");

        /* 最初のセットを読み込み */
        loadSet("atk1");
        loadSet("def1");

        /* セット名入力欄反映 */
        updateNameInput("attack", "atk1");
        updateNameInput("defense", "def1");

    } catch (e) {
        console.error("短縮URL展開失敗:", e);
    }
}

</script>

<script>

/* ============================================
   PART 6: まがりんの元ソース（完全コピー）
============================================ */

function calculateDamage() {
    const getNumber = id => parseFloat(document.getElementById(id).value) || 0;
    
    const physicalAttack = getNumber('physicalAttack');
    const finalPhysicalPenetration = getNumber('finalPhysicalPenetration');
    const criticalDamage = getNumber('criticalDamage');
    const physicalDamageBonus = getNumber('physicalDamageBonus');
    const finalPhysicalDamageBonus = getNumber('finalPhysicalDamageBonus');
    const raceBonus = getNumber('raceBonus');
    const elementBonus = getNumber('elementBonus');
    const sizeEnhance = getNumber('sizeEnhance');
    const finalDamageBonus = getNumber('finalDamageBonus');
    const skillDamageBonus = getNumber('skillDamageBonus');
    const elementEnhance = getNumber('elementEnhance');
    const elementCounter = getNumber('elementCounter');
    const sizeModifier = getNumber('sizeModifier');

    const pvpPhysicalDamageBonus = getNumber('pvpPhysicalDamageBonus');
    const pvpFinalPhysicalDamageBonus = getNumber('pvpFinalPhysicalDamageBonus');

    const skillMultiplier = getNumber('skillMultiplier');
    const skillAddition = getNumber('skillAddition');
    const skillCount = getNumber('skillCount');

    const physicalLifeSteal = getNumber('physicalLifeSteal');
    const physicalReflect = getNumber('physicalReflect');

    const finalPhysicalDefense = getNumber('finalPhysicalDefense');
    const criticalDamageReduction = getNumber('criticalDamageReduction');
    const physicalDamageReduction = getNumber('physicalDamageReduction');
    const finalPhysicalDamageReduction = getNumber('finalPhysicalDamageReduction');
    const finalDamageReduction = getNumber('finalDamageReduction');

    const pvpPhysicalDamageReduction = getNumber('pvpPhysicalDamageReduction');
    const pvpFinalPhysicalDamageReduction = getNumber('pvpFinalPhysicalDamageReduction');

    const targetPhysicalAttack = getNumber('targetPhysicalAttack');
    const targetFinalPhysicalDefense = getNumber('targetFinalPhysicalDefense');
    const targetCriticalDamageReduction = getNumber('targetCriticalDamageReduction');
    const targetPhysicalDamageReduction = getNumber('targetPhysicalDamageReduction');
    const targetFinalPhysicalDamageReduction = getNumber('targetFinalPhysicalDamageReduction');
    const targetRaceReduction = getNumber('targetRaceReduction');
    const targetElementReduction = getNumber('targetElementReduction');
    const targetSizeReduction = getNumber('targetSizeReduction');
    const targetFinalDamageReduction = getNumber('targetFinalDamageReduction');
    const targetElementResistance = getNumber('targetElementResistance');

    const targetPvpPhysicalDamageReduction = getNumber('targetPvpPhysicalDamageReduction');
    const targetPvpFinalPhysicalDamageReduction = getNumber('targetPvpFinalPhysicalDamageReduction');

    let calcFinalPhysicalPenetration = finalPhysicalPenetration - targetFinalPhysicalDefense;
    if (calcFinalPhysicalPenetration < -80) { calcFinalPhysicalPenetration = -80; }

    let calcCriticalDamage = criticalDamage - targetCriticalDamageReduction;
    if (calcCriticalDamage < 20) { calcCriticalDamage = 20; }

    let calcFinalPhysicalDamageBonus = finalPhysicalDamageBonus - targetFinalPhysicalDamageReduction;
    if (calcFinalPhysicalDamageBonus < -80) { calcFinalPhysicalDamageBonus = -80; }

    let calcRaceBonus = raceBonus - targetRaceReduction;
    if (calcRaceBonus < -80) { calcRaceBonus = -80; }

    let calcElementBonus = elementBonus - targetElementReduction;
    if (calcElementBonus < -80) { calcElementBonus = -80; }

    let calcFinalDamageBonus = finalDamageBonus - targetFinalDamageReduction;
    if (calcFinalDamageBonus < -80) { calcFinalDamageBonus = -80; }

    let calcElementEnhance = elementCounter + elementEnhance - targetElementResistance;
    if (calcElementEnhance < 20) { calcElementEnhance = 20; }

    let calcSizeEnhance = sizeModifier + sizeEnhance - targetSizeReduction;
    if (calcSizeEnhance < 20) { calcSizeEnhance = 20; }

    let calcPvpFinalPhysicalDamageBonus = pvpFinalPhysicalDamageBonus - targetPvpFinalPhysicalDamageReduction;
    if (calcPvpFinalPhysicalDamageBonus < -80) { calcPvpFinalPhysicalDamageBonus = -80; }

    let physicalDamageMultiplier =
        (1 + calcFinalPhysicalDamageBonus / 100) *
        (calcElementEnhance / 100) *
        (1 + calcElementBonus / 100) *
        (1 + calcRaceBonus / 100) *
        (1 + calcFinalDamageBonus / 100) *
        (calcSizeEnhance / 100) *
        (1 + skillDamageBonus / 100);

    const normalPhysicalDamage =
        Math.floor(physicalAttack * (1 + calcFinalPhysicalPenetration / 100) + (physicalDamageBonus - targetPhysicalDamageReduction)) *
        physicalDamageMultiplier;

    const criticalPhysicalDamage =
        Math.floor(physicalAttack * (calcCriticalDamage / 100) + (physicalDamageBonus - targetPhysicalDamageReduction)) *
        physicalDamageMultiplier;

    document.getElementById('normalPhysicalDamage').textContent = Math.max(0, Math.floor(normalPhysicalDamage));
    document.getElementById('criticalPhysicalDamage').textContent = Math.max(0, Math.floor(criticalPhysicalDamage));

    const normalSkillPhysicalDamage =
        Math.floor(((skillMultiplier / 100) * physicalAttack + skillAddition) * (1 + calcFinalPhysicalPenetration / 100) +
        (skillCount * physicalDamageBonus - targetPhysicalDamageReduction)) *
        physicalDamageMultiplier;

    const criticalSkillPhysicalDamage =
        Math.floor(((skillMultiplier / 100) * physicalAttack + skillAddition) * (calcCriticalDamage / 100) +
        (skillCount * physicalDamageBonus - targetPhysicalDamageReduction)) *
        physicalDamageMultiplier;

    document.getElementById('normalSkillPhysicalDamage').textContent = Math.max(0, Math.floor(normalSkillPhysicalDamage));
    document.getElementById('criticalSkillPhysicalDamage').textContent = Math.max(0, Math.floor(criticalSkillPhysicalDamage));

    const normalPhysicalLifeSteal =
        (physicalAttack * (1 + finalPhysicalPenetration / 100) *
        (1 + finalPhysicalDamageBonus / 100) *
        (1 + finalDamageBonus / 100) +
        physicalDamageBonus) *
        (physicalLifeSteal / 100);

    const criticalPhysicalLifeSteal =
        (physicalAttack * (criticalDamage / 100) *
        (1 + finalPhysicalDamageBonus / 100) *
        (1 + finalDamageBonus / 100) +
        physicalDamageBonus) *
        (physicalLifeSteal / 100);

    document.getElementById('normalPhysicalLifeSteal').textContent = Math.max(0, Math.floor(normalPhysicalLifeSteal));
    document.getElementById('criticalPhysicalLifeSteal').textContent = Math.max(0, Math.floor(criticalPhysicalLifeSteal));

    const normalSkillPhysicalLifeSteal =
        (((skillMultiplier / 100) * physicalAttack + skillAddition) *
        (1 + finalPhysicalPenetration / 100) *
        (1 + finalPhysicalDamageBonus / 100) *
        (1 + finalDamageBonus / 100) +
        physicalDamageBonus) *
        (physicalLifeSteal / 100);

    const criticalSkillPhysicalLifeSteal =
        (((skillMultiplier / 100) * physicalAttack + skillAddition) *
        (criticalDamage / 100) *
        (1 + finalPhysicalDamageBonus / 100) *
        (1 + finalDamageBonus / 100) +
        physicalDamageBonus) *
        (physicalLifeSteal / 100);

    document.getElementById('normalSkillPhysicalLifeSteal').textContent = Math.max(0, Math.floor(normalSkillPhysicalLifeSteal));
    document.getElementById('criticalSkillPhysicalLifeSteal').textContent = Math.max(0, Math.floor(criticalSkillPhysicalLifeSteal));

    const normalPhysicalReflect =
        (targetPhysicalAttack *
        (1 + finalPhysicalDefense / 100) *
        (1 + finalPhysicalDamageReduction) *
        (1 + finalDamageReduction) +
        physicalDamageReduction) *
        (physicalReflect / 100);

    const criticalPhysicalReflect =
        (targetPhysicalAttack *
        (2 + criticalDamageReduction / 100) *
        (1 + finalPhysicalDamageReduction) *
        (1 + finalDamageReduction) +
        physicalDamageReduction) *
        (physicalReflect / 100);

    document.getElementById('normalPhysicalReflect').textContent = Math.max(0, Math.floor(normalPhysicalReflect));
    document.getElementById('criticalPhysicalReflect').textContent = Math.max(0, Math.floor(criticalPhysicalReflect));

    const normalSkillPhysicalReflect =
        (((skillMultiplier / 100) * targetPhysicalAttack + skillAddition) *
        (1 + finalPhysicalDefense / 100) *
        (1 + finalPhysicalDamageReduction) *
        (1 + finalDamageReduction) +
        physicalDamageReduction) *
        (physicalReflect / 100);

    const criticalSkillPhysicalReflect =
        (((skillMultiplier / 100) * targetPhysicalAttack + skillAddition) *
        (2 + criticalDamageReduction / 100) *
        (1 + finalPhysicalDamageReduction) *
        (1 + finalDamageReduction) +
        physicalDamageReduction) *
        (physicalReflect / 100);

    document.getElementById('normalSkillPhysicalReflect').textContent = Math.max(0, Math.floor(normalSkillPhysicalReflect));
    document.getElementById('criticalSkillPhysicalReflect').textContent = Math.max(0, Math.floor(criticalSkillPhysicalReflect));

    let pvpNormalPhysicalDamageBase =
        (8 * normalPhysicalDamage ** 0.6 + pvpPhysicalDamageBonus - targetPvpPhysicalDamageReduction);
    if (pvpNormalPhysicalDamageBase < 0) { pvpNormalPhysicalDamageBase = 0; }

    const pvpNormalPhysicalDamage =
        pvpNormalPhysicalDamageBase * (1 + calcPvpFinalPhysicalDamageBonus / 100);

    let pvpCriticalPhysicalDamageBase =
        (8 * criticalPhysicalDamage ** 0.6 + pvpPhysicalDamageBonus - targetPvpPhysicalDamageReduction);
    if (pvpCriticalPhysicalDamageBase < 0) { pvpCriticalPhysicalDamageBase = 0; }

    const pvpCriticalPhysicalDamage =
        pvpCriticalPhysicalDamageBase * (1 + calcPvpFinalPhysicalDamageBonus / 100);

    document.getElementById('pvpNormalPhysicalDamage').textContent = Math.max(0, Math.floor(pvpNormalPhysicalDamage));
    document.getElementById('pvpCriticalPhysicalDamage').textContent = Math.max(0, Math.floor(pvpCriticalPhysicalDamage));

    let pvpNormalSkillPhysicalDamageBase =
        (16 * normalSkillPhysicalDamage ** 0.6 + pvpPhysicalDamageBonus - targetPvpPhysicalDamageReduction);
    if (pvpNormalSkillPhysicalDamageBase < 0) { pvpNormalSkillPhysicalDamageBase = 0; }

    const pvpNormalSkillPhysicalDamage =
        pvpNormalSkillPhysicalDamageBase * (1 + calcPvpFinalPhysicalDamageBonus / 100);

    let pvpCriticalSkillPhysicalDamageBase =
        (16 * criticalSkillPhysicalDamage ** 0.6 + pvpPhysicalDamageBonus - targetPvpPhysicalDamageReduction);
    if (pvpCriticalSkillPhysicalDamageBase < 0) { pvpCriticalSkillPhysicalDamageBase = 0; }

    const pvpCriticalSkillPhysicalDamage =
        pvpCriticalSkillPhysicalDamageBase * (1 + calcPvpFinalPhysicalDamageBonus / 100);

    document.getElementById('pvpNormalSkillPhysicalDamage').textContent = Math.max(0, Math.floor(pvpNormalSkillPhysicalDamage));
    document.getElementById('pvpCriticalSkillPhysicalDamage').textContent = Math.max(0, Math.floor(pvpCriticalSkillPhysicalDamage));

    const pvpNormalPhysicalLifeSteal =
        (3 * normalPhysicalLifeSteal ** 0.6) * (1 + calcPvpFinalPhysicalDamageBonus / 100);

    const pvpCriticalPhysicalLifeSteal =
        (3 * criticalPhysicalLifeSteal ** 0.6) * (1 + calcPvpFinalPhysicalDamageBonus / 100);

    document.getElementById('pvpNormalPhysicalLifeSteal').textContent = Math.max(0, Math.floor(pvpNormalPhysicalLifeSteal));
    document.getElementById('pvpCriticalPhysicalLifeSteal').textContent = Math.max(0, Math.floor(pvpCriticalPhysicalLifeSteal));

    const pvpNormalSkillPhysicalLifeSteal =
        (6 * normalSkillPhysicalLifeSteal ** 0.6) * (1 + calcPvpFinalPhysicalDamageBonus / 100);

    const pvpCriticalSkillPhysicalLifeSteal =
        (6 * criticalSkillPhysicalLifeSteal ** 0.6) * (1 + calcPvpFinalPhysicalDamageBonus / 100);

    document.getElementById('pvpNormalSkillPhysicalLifeSteal').textContent = Math.max(0, Math.floor(pvpNormalSkillPhysicalLifeSteal));
    document.getElementById('pvpCriticalSkillPhysicalLifeSteal').textContent = Math.max(0, Math.floor(pvpCriticalSkillPhysicalLifeSteal));

    const pvpNormalPhysicalReflect =
        (3 * normalPhysicalReflect ** 0.6) * (1 + pvpFinalPhysicalDamageReduction / 100);

    const pvpCriticalPhysicalReflect =
        (3 * criticalPhysicalReflect ** 0.6) * (1 + pvpFinalPhysicalDamageReduction / 100);

    document.getElementById('pvpNormalPhysicalReflect').textContent = Math.max(0, Math.floor(pvpNormalPhysicalReflect));
    document.getElementById('pvpCriticalPhysicalReflect').textContent = Math.max(0, Math.floor(pvpCriticalPhysicalReflect));

    const pvpNormalSkillPhysicalReflect =
        (6 * normalSkillPhysicalReflect ** 0.6) * (1 + pvpFinalPhysicalDamageReduction / 100);

    const pvpCriticalSkillPhysicalReflect =
        (6 * criticalSkillPhysicalReflect ** 0.6) * (1 + pvpFinalPhysicalDamageReduction / 100);

    document.getElementById('pvpNormalSkillPhysicalReflect').textContent = Math.max(0, Math.floor(pvpNormalSkillPhysicalReflect));
    document.getElementById('pvpCriticalSkillPhysicalReflect').textContent = Math.max(0, Math.floor(pvpCriticalSkillPhysicalReflect));
}

</script>
<script>

/* ============================================
   PART 7: 初期化処理
============================================ */

document.addEventListener("DOMContentLoaded", () => {

    /* タブ並び順復元 */
    restoreTabOrder("attackTabs", "attackOrder");
    restoreTabOrder("defenseTabs", "defenseOrder");

    /* ドラッグ並び替え有効化 */
    enableTabDrag("attackTabs", "attackOrder");
    enableTabDrag("defenseTabs", "defenseOrder");

    /* セット名反映 */
    loadSetNames();

    /* 短縮URLデータがあれば復元 */
    loadShortURLData();

    /* 最初のセットを読み込み */
    loadSet("atk1");
    loadSet("def1");

    /* セット名入力欄反映 */
    updateNameInput("attack", "atk1");
    updateNameInput("defense", "def1");

    /* タブクリック時の動作 */
    document.querySelectorAll("#attackTabs .tab-button").forEach(btn => {
        btn.addEventListener("click", () => {
            const key = btn.dataset.set;

            /* セット読み込み */
            loadSet(key);

            /* セット名入力欄反映 */
            updateNameInput("attack", key);

            /* アクティブ表示 */
            document.querySelectorAll("#attackTabs .tab-button")
                .forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
        });
    });

    document.querySelectorAll("#defenseTabs .tab-button").forEach(btn => {
        btn.addEventListener("click", () => {
            const key = btn.dataset.set;

            /* セット読み込み */
            loadSet(key);

            /* セット名入力欄反映 */
            updateNameInput("defense", key);

            /* アクティブ表示 */
            document.querySelectorAll("#defenseTabs .tab-button")
                .forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
        });
    });

    /* セット名保存ボタン */
    document.getElementById("saveAttackName").addEventListener("click", () => {
        const active = document.querySelector("#attackTabs .tab-button.active");
        if (!active) return;

        const key = active.dataset.set;
        const name = document.getElementById("attackSetName").value;

        saveSetName("attack", key, name);
        loadSetNames();
    });

    document.getElementById("saveDefenseName").addEventListener("click", () => {
        const active = document.querySelector("#defenseTabs .tab-button.active");
        if (!active) return;

        const key = active.dataset.set;
        const name = document.getElementById("defenseSetName").value;

        saveSetName("defense", key, name);
        loadSetNames();
    });

});

</script>
